name: Hourly job refresh

on:
  # Triggered every 30 min (08:05-22:35 Melbourne) by cron-job.org via the dispatch API;
  # GitHub's own schedule was dropped because it fired only every few hours.
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email even if there are no new jobs"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hourly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl yeeyi + 华人贴, rebuild map data, report new jobs
        run: |
          python3 build_map.py | tee report.txt
          { echo '## 新增职位'; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Email new jobs (Gmail)
        continue-on-error: true # a mail problem must not block the map update
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 notify_email.py report.txt ${{ inputs.test_email && '--test' || '' }}

      - name: Push data (Vercel redeploys on push)
        run: |
          # Commit as the repo owner: Vercel Hobby skips deploys for commits by unknown authors.
          git config user.name "Shawn-Wang"
          git config user.email "jadesure17@gmail.com"
          git add public/jobs.json state.json geocode.json details_cache.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: hourly refresh"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
